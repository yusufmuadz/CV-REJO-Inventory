name: cv_rejo
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.2
  google_fonts: ^6.3.2
  ionicons: ^0.2.2
  get_storage: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  loading_animation_widget: ^1.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  mobile_scanner: ^7.1.4
  http_parser: ^4.1.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  dotted_border: ^3.1.0
  connectivity_plus: ^7.1.1
  http: ^1.6.0
  camera: ^0.12.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.jpeg
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/logo/logo.jpeg
  android_icon_name: "ic_launcher"
  android_icon_name_round: "ic_launcher_round"

